[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pusht-policy-eval"
version = "0.1.0"
description = "Reproducible robustness evaluation of LeRobot policies on PushT"
requires-python = ">=3.10"
dependencies = ["lerobot[pusht,diffusion]==0.6.1", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
