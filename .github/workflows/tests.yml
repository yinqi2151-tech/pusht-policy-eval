name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests need the PushT simulator but not LeRobot/torch.
      - run: pip install "gym-pusht==0.1.8" "gymnasium>=1.1" numpy opencv-python-headless pytest
      - run: pytest
